              // ---------- efek kaca (glass) ala iPhone ----------
              private Drawable glass(int r) {
                  GradientDrawable tint = shape(withAlpha(cBg, 0x66), r);
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{0x38FFFFFF, 0x10FFFFFF});
                  g.setCornerRadius(dp(r));
                  g.setStroke(Math.max(1, dp(1)), 0x40FFFFFF);
                  return new LayerDrawable(new Drawable[]{tint, g});
              }

              private Drawable selPill() {
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{withAlpha(cAcc, 0xB0), withAlpha(cAcc2, 0x70)});
                  g.setCornerRadius(dp(18));
                  g.setStroke(Math.max(1, dp(1)), 0x66FFFFFF);
                  return g;
              }

              // tekan = mengecil, lepas = membal (seperti sentuhan iOS)
              private void pressable(View v) {
                  v.setOnTouchListener((view, e) -> {
                      int a = e.getActionMasked();
                      if (a == MotionEvent.ACTION_DOWN) {
                          view.animate().scaleX(0.95f).scaleY(0.95f).setStartDelay(0).setDuration(120)
                                  .setInterpolator(new DecelerateInterpolator()).start();
                      } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                          view.animate().scaleX(1f).scaleY(1f).setStartDelay(0).setDuration(420)
                                  .setInterpolator(new OvershootInterpolator(3f)).start();
                      }
                      return false;
                  });
              }

              // isi halaman muncul bergantian dari bawah
              private void animateIn(View v) {
                  if (!(v instanceof ScrollView)) return;
                  ScrollView sv = (ScrollView) v;
                  if (sv.getChildCount() == 0 || !(sv.getChildAt(0) instanceof ViewGroup)) return;
                  ViewGroup g = (ViewGroup) sv.getChildAt(0);
                  for (int i = 0; i < g.getChildCount(); i++) {
                      View c = g.getChildAt(i);
                      c.setAlpha(0f);
                      c.setTranslationY(dp(22));
                      c.animate().alpha(1f).translationY(0f).setStartDelay(Math.min(i, 8) * 50L).setDuration(450)
                              .setInterpolator(new DecelerateInterpolator(2f)).start();
                  }
              }

              private String mbText(long got, long len) {
                  if (len > 0) return String.format(Locale.US, "%.1f / %.1f MB", got / 1048576f, len / 1048576f);
                  return String.format(Locale.US, "%.1f MB", got / 1048576f);
              }

              private void applyWallAlpha() {
                  float a = prefs.getInt("wall_alpha", 100) / 100f;
                  wallImg.setAlpha(a);
                  wallVideo.setAlpha(a);
              }

              private boolean isMuted() {
                  return prefs.getBoolean("wall_mute", true);
              }

              private boolean isVideoWall() {
                  return "video".equals(prefs.getString("wall_type", "")) && prefs.getString("wall_path", null) != null;
              }

              private void toggleMute() {
                  boolean m = !isMuted();
                  prefs.edit().putBoolean("wall_mute", m).apply();
                  if (player != null) {
                      try {
                          float vol = m ? 0f : 1f;
                          player.setVolume(vol, vol);
                      } catch (Exception ignored) {
                      }
                  }
                  if (!isVideoWall()) toast("Disimpan, berlaku untuk wallpaper video");
                  else toast(m ? "Wallpaper di-mute" : "Wallpaper unmute");
              }

              // ---------- theme ----------
              private void loadTheme() {
                  int th = prefs.getInt("theme", 0);
                  int hue = prefs.getInt("hue", 270);
                  if (th >= 0 && th < PRESETS.length) {
                      cBg = PRESETS[th][0];
                      cCard = PRESETS[th][1];
                      cAcc = PRESETS[th][2];
                      cAcc2 = PRESETS[th][3];
                  } else {
                      cBg = hsv(hue, 0.80f, 0.14f);
                      cCard = hsv(hue, 0.65f, 0.32f);
                      cAcc = hsv(hue, 0.80f, 0.90f);
                      cAcc2 = hsv(hue + 40, 0.80f, 0.95f);
