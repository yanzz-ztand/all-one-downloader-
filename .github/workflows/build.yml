                      if (a == MotionEvent.ACTION_DOWN) {
                          view.animate().scaleX(0.95f).scaleY(0.95f).setStartDelay(0).setDuration(120)
                                  .setInterpolator(new DecelerateInterpolator()).start();
                      } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                          view.animate().scaleX(1f).scaleY(1f).setStartDelay(0).setDuration(420)
                                  .setInterpolator(new OvershootInterpolator(3f)).start();
                      }
                      return false;
                  });
              }

              // isi halaman muncul bergantian dari bawah
              private void animateIn(View v) {
                  if (!(v instanceof ScrollView)) return;
                  ScrollView sv = (ScrollView) v;
                  if (sv.getChildCount() == 0 || !(sv.getChildAt(0) instanceof ViewGroup)) return;
                  ViewGroup g = (ViewGroup) sv.getChildAt(0);
                  for (int i = 0; i < g.getChildCount(); i++) {
                      View c = g.getChildAt(i);
                      c.setAlpha(0f);
                      c.setTranslationY(dp(22));
                      c.animate().alpha(1f).translationY(0f).setStartDelay(Math.min(i, 8) * 50L).setDuration(450)
                              .setInterpolator(new DecelerateInterpolator(2f)).start();
                  }
              }

