                  mid.addView(name, new LinearLayout.LayoutParams(-1, -2));

                  LinearLayout line = new LinearLayout(this);
                  line.setGravity(Gravity.CENTER_VERTICAL);
                  TextView mb = tv(t.mb.isEmpty() ? "0.0 MB" : t.mb, 20, WHITE, true);
                  mb.setSingleLine(true);
