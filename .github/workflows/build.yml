              private void refreshRecent() {
                  if (recentBox == null || tab != 0) return;
                  recentBox.removeAllViews();
                  for (Task t : tasks) {
                      recentBox.addView(makeRow(t.name, t.progress, t.progress < 0, t.label, t, null),
