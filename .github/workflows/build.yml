              // panel kaca ala iPhone: pinggir bercahaya + kilau yang menyapu pelan
              static class GlassBox extends LinearLayout {
                  private final Paint rim = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint sheen = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF rf = new RectF();
                  private final RectF rr = new RectF();
                  private final Path clip = new Path();
                  private final Matrix mx = new Matrix();
                  private final float rad;
                  private LinearGradient sheenShader;
                  private float t = -1f;
                  private ValueAnimator anim;
                  private final Runnable loop = new Runnable() {
                      @Override
                      public void run() {
                          sweep();
                      }
                  };

                  GlassBox(Context c, int radiusPx) {
                      super(c);
                      rad = radiusPx;
                      setWillNotDraw(false);
                      rim.setStyle(Paint.Style.STROKE);
                      rim.setStrokeWidth(c.getResources().getDisplayMetrics().density * 1.2f);
                  }

                  @Override
                  protected void onSizeChanged(int w, int h, int ow, int oh) {
                      super.onSizeChanged(w, h, ow, oh);
                      rf.set(0, 0, w, h);
                      float half = rim.getStrokeWidth() / 2f;
                      rr.set(half, half, w - half, h - half);
                      clip.reset();
                      clip.addRoundRect(rf, rad, rad, Path.Direction.CW);
                      rim.setShader(new LinearGradient(0, 0, w * 0.5f, h,
                              new int[]{0xAAFFFFFF, 0x14FFFFFF, 0x44FFFFFF}, new float[]{0f, 0.55f, 1f}, Shader.TileMode.CLAMP));
                      float band = Math.max(1f, w * 0.4f);
                      sheenShader = new LinearGradient(0, 0, band, 0,
                              new int[]{0x00FFFFFF, 0x2EFFFFFF, 0x00FFFFFF}, null, Shader.TileMode.CLAMP);
                      sheen.setShader(sheenShader);
                  }

                  @Override
                  protected void dispatchDraw(Canvas cv) {
                      super.dispatchDraw(cv);
                      if (t >= 0f && sheenShader != null) {
                          float w = getWidth();
                          float band = w * 0.4f;
                          mx.reset();
                          mx.setRotate(16f);
                          mx.postTranslate(-band + t * (w + band * 2f), 0f);
                          sheenShader.setLocalMatrix(mx);
                          cv.save();
                          cv.clipPath(clip);
                          cv.drawRect(rf, sheen);
                          cv.restore();
                      }
                      cv.drawRoundRect(rr, rad, rad, rim);
                  }

                  private void sweep() {
                      if (anim != null) anim.cancel();
                      anim = ValueAnimator.ofFloat(0f, 1f);
                      anim.setDuration(1300);
                      anim.setInterpolator(new AccelerateDecelerateInterpolator());
                      anim.addUpdateListener(a -> {
                          t = (float) a.getAnimatedValue();
                          invalidate();
                      });
                      anim.addListener(new AnimatorListenerAdapter() {
                          private boolean cancelled = false;

                          @Override
                          public void onAnimationCancel(Animator a) {
                              cancelled = true;
                          }

                          @Override
                          public void onAnimationEnd(Animator a) {
                              t = -1f;
                              invalidate();
                              if (!cancelled && isAttachedToWindow()) postDelayed(loop, 4200);
                          }
                      });
                      anim.start();
                  }

                  @Override
                  protected void onAttachedToWindow() {
                      super.onAttachedToWindow();
                      postDelayed(loop, 600 + (long) (Math.random() * 1500));
                  }

                  @Override
                  protected void onDetachedFromWindow() {
                      super.onDetachedFromWindow();
                      removeCallbacks(loop);
                      if (anim != null) anim.cancel();
                  }
              }

