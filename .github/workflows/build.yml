              static class RainbowSpinner extends View {
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF r = new RectF();
                  private float angle = 0f;

                  RainbowSpinner(Context c) {
                      super(c);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeCap(Paint.Cap.ROUND);
                  }

                  @Override
                  protected void onSizeChanged(int w, int h, int ow, int oh) {
                      super.onSizeChanged(w, h, ow, oh);
                      float sw = Math.min(w, h) * 0.12f;
                      p.setStrokeWidth(sw);
                      float half = sw / 2f + 1f;
                      r.set(half, half, w - half, h - half);
                      p.setShader(new SweepGradient(w / 2f, h / 2f,
                              new int[]{0xFFFF1744, 0xFFFFEA00, 0xFF00E676, 0xFF00B0FF, 0xFFD500F9, 0xFFFF1744}, null));
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      cv.save();
                      cv.rotate(angle, getWidth() / 2f, getHeight() / 2f);
                      cv.drawArc(r, 0, 300, false, p);
                      cv.restore();
                      angle = (angle + 7f) % 360f;
                      postInvalidateOnAnimation();
                  }
              }

              // foto profil dengan bingkai RGB (ungu - kuning - hijau) yang berputar + glow
              static class RgbAvatar extends View {
                  private final Paint ring = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint glow = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint img = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Matrix m = new Matrix();
                  private final Bitmap bmp;
                  private float cx, cy, ringR, photoR;
                  private float angle = 0f;

                  RgbAvatar(Context c, Bitmap b) {
                      super(c);
                      bmp = b;
                      setLayerType(LAYER_TYPE_SOFTWARE, null);
                      ring.setStyle(Paint.Style.STROKE);
                      glow.setStyle(Paint.Style.STROKE);
                  }

                  @Override
                  protected void onSizeChanged(int w, int h, int ow, int oh) {
                      super.onSizeChanged(w, h, ow, oh);
                      float size = Math.min(w, h);
                      float sw = size * 0.06f;
                      cx = w / 2f;
                      cy = h / 2f;
                      ringR = size / 2f - sw * 1.8f;
                      photoR = ringR - sw * 0.9f;
                      ring.setStrokeWidth(sw);
                      glow.setStrokeWidth(sw * 1.6f);
                      glow.setMaskFilter(new BlurMaskFilter(Math.max(1f, sw), BlurMaskFilter.Blur.NORMAL));
                      SweepGradient sg = new SweepGradient(cx, cy,
                              new int[]{0xFFA855F7, 0xFFFACC15, 0xFF22C55E, 0xFFA855F7}, null);
                      ring.setShader(sg);
                      glow.setShader(sg);
                      glow.setAlpha(150);
                      if (bmp != null) {
                          BitmapShader bs = new BitmapShader(bmp, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP);
                          float sc = Math.max(2f * photoR / bmp.getWidth(), 2f * photoR / bmp.getHeight());
                          m.reset();
                          m.setScale(sc, sc);
                          m.postTranslate(cx - bmp.getWidth() * sc / 2f, cy - bmp.getHeight() * sc / 2f);
                          bs.setLocalMatrix(m);
                          img.setShader(bs);
                      }
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      if (bmp != null) cv.drawCircle(cx, cy, photoR, img);
                      cv.save();
                      cv.rotate(angle, cx, cy);
                      cv.drawCircle(cx, cy, ringR, glow);
                      cv.drawCircle(cx, cy, ringR, ring);
                      cv.restore();
                      angle = (angle + 2.5f) % 360f;
                      postInvalidateOnAnimation();
                  }
              }

