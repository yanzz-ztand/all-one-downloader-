              private void showTab(int t) {
                  tab = t;
                  content.removeAllViews();
                  View v;
                  if (t == 0) v = buildHome();
                  else if (t == 1) v = buildHistory();
                  else if (t == 2) v = buildProfile();
                  else if (t == 3) v = buildAbout();
                  else v = buildSettings();
                  content.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  animateIn(v);
                  refreshNav();
              }

              private void refreshNav() {
                  navBox.removeAllViews();
                  int[] icons = {R.drawable.ic_home, R.drawable.ic_history, R.drawable.ic_profile, R.drawable.ic_info, R.drawable.ic_settings};
                  String[] labels = {"Home", "History", "Profile", "About", "Settings"};
