              // ---------- theme ----------
              private void loadTheme() {
                  int th = prefs.getInt("theme", 0);
                  int hue = prefs.getInt("hue", 270);
                  if (th >= 0 && th < PRESETS.length) {
                      cBg = PRESETS[th][0];
                      cCard = PRESETS[th][1];
                      cAcc = PRESETS[th][2];
                      cAcc2 = PRESETS[th][3];
                  } else {
                      cBg = hsv(hue, 0.80f, 0.14f);
                      cCard = hsv(hue, 0.65f, 0.32f);
                      cAcc = hsv(hue, 0.80f, 0.90f);
                      cAcc2 = hsv(hue + 40, 0.80f, 0.95f);
                  }
              }

              private void applyColors() {
                  getWindow().setStatusBarColor(cBg);
                  getWindow().setNavigationBarColor(cBg);
