                          TextView lb = tv(THEME_NAMES[idx], 12, WHITE, false);
                          lb.setGravity(Gravity.CENTER);
                          chip.addView(lb, lp(-2, -2, 0, dp(6), 0, 0));
                          chip.setOnClickListener(v -> {
                              prefs.edit().putInt("theme", idx).apply();
                              loadTheme();
                              applyColors();
                              buildUI();
                          });
                          LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, -2, 1f);
                          p.setMargins(dp(4), dp(4), dp(4), dp(4));
                          row.addView(chip, p);
                      }
                      grid.addView(row, new LinearLayout.LayoutParams(-1, -2));
                  }
                  col.addView(grid, new LinearLayout.LayoutParams(-1, -2));

                  col.addView(tv("Warna Custom (geser lalu lepas)", 13, 0xCCFFFFFF, false), lp(-2, -2, 0, dp(12), 0, 0));
                  final View prev = new View(this);
                  int hue0 = prefs.getInt("hue", 270);
                  prev.setBackground(grad(hsv(hue0, 0.8f, 0.9f), hsv(hue0 + 40, 0.8f, 0.95f), 10));
                  col.addView(prev, lp(-1, dp(20), 0, dp(6), 0, 0));
                  SeekBar sb = new SeekBar(this);
                  sb.setMax(359);
                  sb.setProgress(hue0);
                  sb.setProgressTintList(ColorStateList.valueOf(cAcc));
                  sb.setThumbTintList(ColorStateList.valueOf(cAcc));
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean user) {
                          prev.setBackground(grad(hsv(p, 0.8f, 0.9f), hsv(p + 40, 0.8f, 0.95f), 10));
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar s) {
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar s) {
                          prefs.edit().putInt("hue", s.getProgress()).putInt("theme", 5).apply();
                          loadTheme();
                          applyColors();
                          buildUI();
                      }
                  });
                  col.addView(sb, lp(-1, -2, 0, dp(4), 0, 0));

                  col.addView(tv("Wallpaper", 17, WHITE, true), lp(-2, -2, 0, dp(18), 0, dp(4)));
                  col.addView(tv("Pilih foto atau video dari galeri. Video diputar berulang, suara bisa di-mute / unmute.", 13, 0xCCFFFFFF, false));
                  Button pick = button("Pilih Foto / Video", true);
                  pick.setOnClickListener(v -> pickWallpaper());
                  col.addView(pick, lp(-1, dp(50), 0, dp(10), 0, 0));
                  Button del = button("Hapus Wallpaper", false);
                  del.setOnClickListener(v -> removeCustomWallpaper());
                  col.addView(del, lp(-1, dp(50), 0, dp(8), 0, 0));

                  // mute / unmute wallpaper video
                  final ImageView mi = icon(isMuted() ? R.drawable.ic_volume_off : R.drawable.ic_volume_on, 10, WHITE);
                  mi.setBackground(shape(withAlpha(cAcc, 0x88), 20));
                  final TextView ms = tv(isMuted() ? "Mute (ketuk untuk Unmute)" : "Unmute (ketuk untuk Mute)", 12, 0xCCFFFFFF, false);
                  LinearLayout muteRow = new LinearLayout(this);
                  muteRow.setGravity(Gravity.CENTER_VERTICAL);
                  muteRow.setPadding(dp(12), dp(10), dp(14), dp(10));
                  muteRow.setBackground(glass(18));
                  muteRow.addView(mi, new LinearLayout.LayoutParams(dp(40), dp(40)));
                  LinearLayout mt = new LinearLayout(this);
                  mt.setOrientation(LinearLayout.VERTICAL);
                  mt.addView(tv("Suara Wallpaper", 15, WHITE, true));
                  mt.addView(ms);
                  LinearLayout.LayoutParams mtp = new LinearLayout.LayoutParams(0, -2, 1f);
                  mtp.leftMargin = dp(12);
                  muteRow.addView(mt, mtp);
                  muteRow.setOnClickListener(v -> {
                      toggleMute();
                      boolean m = isMuted();
                      mi.setImageResource(m ? R.drawable.ic_volume_off : R.drawable.ic_volume_on);
                      ms.setText(m ? "Mute (ketuk untuk Unmute)" : "Unmute (ketuk untuk Mute)");
                  });
                  pressable(muteRow);
                  col.addView(muteRow, lp(-1, -2, 0, dp(12), 0, 0));

                  return scroll(col);
              }

              // ---------- DOWNLOAD ----------
              private void startDownload() {
                  final String link = (input != null ? input.getText().toString() : linkText).trim();
                  if (!link.startsWith("http")) {
                      toast("Tempel link yang valid dulu");
                      return;
                  }
                  final Task t = new Task();
                  t.name = "Mengambil info...";
                  tasks.add(0, t);
                  refreshRecent();
                  final int mode = prefs.getInt("dl_type", 0);
                  new Thread(() -> runDownload(link, t, mode)).start();
              }

              private void updateTask(final Task t, final int pct, final String label, final String mb) {
                  runOnUiThread(() -> {
                      t.progress = pct;
                      t.label = label;
                      t.mb = mb;
                      if (t.bar != null) {
                          if (pct < 0) {
                              t.bar.setIndeterminate(true);
                          } else {
                              t.bar.setIndeterminate(false);
                              t.bar.setProgress(pct);
                          }
                      }
                      if (t.pct != null) t.pct.setText(label);
                      if (t.mbView != null) t.mbView.setText(mb.isEmpty() ? "0.0 MB" : mb);
                  });
              }

              private void runDownload(String link, final Task t, final int mode) {
                  try {
                      JSONObject result = fetchInfo(link);
                      String title = result.optString("title", "").replaceAll("\\s+", " ").trim();
                      if (title.isEmpty()) title = result.optString("caption", "").replaceAll("\\s+", " ").trim();
                      if (title.isEmpty()) title = "download";
                      final String shown = title.length() > 60 ? title.substring(0, 60) : title;
                      t.name = shown;
                      runOnUiThread(() -> refreshRecent());

                      Plan plan = pickMedias(result, mode);
                      String base = safeName(title);
                      Exception last = null;

                      if (plan.all) {
                          int n = plan.list.size();
                          int saved = 0;
                          for (int i = 0; i < n; i++) {
                              try {
                                  download(plan.list.get(i), n > 1 ? shown + " (" + (i + 1) + "/" + n + ")" : shown,
                                          base + "_" + (i + 1), link, t, i, n);
                                  saved++;
                              } catch (Exception e) {
                                  last = e;
                              }
                          }
                          if (saved == 0) throw last != null ? last : new Exception("Gagal download");
                      } else {
                          Uri ok = null;
                          int tries = Math.min(5, plan.list.size());
                          for (int i = 0; i < tries && ok == null; i++) {
                              try {
                                  ok = download(plan.list.get(i), shown, base, link, t, 0, 1);
                              } catch (Exception e) {
                                  last = e;
                                  updateTask(t, -1, "Coba server lain...", "");
                              }
                          }
                          if (ok == null) throw last != null ? last : new Exception("Gagal download");
                      }

                      runOnUiThread(() -> {
                          tasks.remove(t);
                          refreshRecent();
                          toast("Tersimpan di galeri (folder AllInOneDownloader)");
                      });
                  } catch (Exception e) {
                      final String msg = e.getMessage() == null ? e.toString() : e.getMessage();
                      runOnUiThread(() -> {
                          tasks.remove(t);
                          refreshRecent();
                          toast("Gagal: " + msg);
                      });
                  }
              }

              private String safeName(String s) {
                  String n = s.replaceAll("[^A-Za-z0-9 _-]", "").trim().replace(' ', '_');
                  if (n.length() > 40) n = n.substring(0, 40);
                  return n.isEmpty() ? "download" : n;
              }

              private String readAll(InputStream is) throws Exception {
                  try (InputStream in = is) {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      return bo.toString("UTF-8");
                  }
              }

              private JSONObject fetchInfo(String link) throws Exception {
                  Exception last = null;
                  for (int attempt = 0; attempt < 2; attempt++) {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(API + URLEncoder.encode(link, "UTF-8")).openConnection();
                          c.setConnectTimeout(25000);
                          c.setReadTimeout(60000);
                          c.setRequestProperty("User-Agent", UA);
                          c.setRequestProperty("Accept", "application/json");
                          int code = c.getResponseCode();
                          InputStream is = code >= 400 ? c.getErrorStream() : c.getInputStream();
                          String body = is == null ? "" : readAll(is);
                          c.disconnect();
                          JSONObject json = new JSONObject(body);
                          if (!json.optBoolean("status", false)) {
                              throw new Exception(json.optString("message", "API menolak link"));
                          }
                          JSONObject result = json.optJSONObject("result");
                          if (result == null) throw new Exception("Respon API kosong");
                          return result;
                      } catch (Exception e) {
                          last = e;
                          try {
                              Thread.sleep(800);
                          } catch (InterruptedException ignored) {
                          }
                      }
                  }
                  throw last;
              }

              private int score(JSONObject m) {
                  String q = m.optString("quality", "").toLowerCase(Locale.ROOT);
                  if (q.equals("hd_no_watermark")) return 0;
                  if (q.equals("no_watermark")) return 1;
                  if (q.contains("hd")) return 2;
                  return 3;
              }

              private Plan pickMedias(JSONObject result, int mode) throws Exception {
                  ArrayList<JSONObject> vids = new ArrayList<>();
                  ArrayList<JSONObject> auds = new ArrayList<>();
                  ArrayList<JSONObject> imgs = new ArrayList<>();
                  ArrayList<JSONObject> others = new ArrayList<>();

                  JSONArray medias = result.optJSONArray("medias");
                  if (medias != null) {
                      for (int i = 0; i < medias.length(); i++) {
                          JSONObject m = medias.optJSONObject(i);
                          if (m == null || m.optString("url", "").isEmpty()) continue;
                          String type = m.optString("type", "").toLowerCase(Locale.ROOT);
                          if (type.contains("video")) vids.add(m);
                          else if (type.contains("audio")) auds.add(m);
                          else if (type.contains("image")) imgs.add(m);
                          else others.add(m);
                      }
                  }
                  if (vids.isEmpty() && auds.isEmpty() && imgs.isEmpty() && others.isEmpty()) {
                      String u = result.optString("url", "");
                      if (u.isEmpty()) throw new Exception("Media tidak ditemukan");
                      JSONObject m = new JSONObject();
                      m.put("url", u);
                      others.add(m);
                  }
                  Collections.sort(vids, (a, b) -> Integer.compare(score(a), score(b)));

                  Plan p = new Plan();
                  // tipe download pilihan user: 1 = video, 2 = audio, 3 = foto, 0 = All (otomatis)
                  if (mode == 1) {
                      if (vids.isEmpty()) throw new Exception("Video tidak tersedia untuk link ini");
                      p.list = vids;
                      return p;
                  }
                  if (mode == 2) {
                      if (auds.isEmpty()) throw new Exception("Audio tidak tersedia untuk link ini");
                      p.list = auds;
                      return p;
                  }
                  if (mode == 3) {
                      if (imgs.isEmpty()) throw new Exception("Foto tidak tersedia untuk link ini");
                      p.list = imgs;
                      p.all = true;
                      return p;
                  }
                  if (!vids.isEmpty()) p.list = vids;
                  else if (!auds.isEmpty()) p.list = auds;
                  else if (!imgs.isEmpty()) {
                      p.list = imgs;
                      p.all = true;
                  } else p.list = others;
                  return p;
              }

              private String originOf(String url) {
                  try {
                      URL u = new URL(url);
                      return u.getProtocol() + "://" + u.getHost() + "/";
                  } catch (Exception e) {
                      return null;
                  }
              }

              // buka koneksi + ikuti redirect manual (termasuk http -> https)
              private HttpURLConnection open(String url, String ref) throws Exception {
                  String cur = url;
                  for (int i = 0; i < 8; i++) {
                      HttpURLConnection c = (HttpURLConnection) new URL(cur).openConnection();
                      c.setInstanceFollowRedirects(false);
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(30000);
                      c.setRequestProperty("User-Agent", UA);
                      c.setRequestProperty("Accept", "*/*");
                      c.setRequestProperty("Accept-Encoding", "identity");
                      if (ref != null) c.setRequestProperty("Referer", ref);
                      int code = c.getResponseCode();
                      if (code >= 300 && code < 400) {
                          String loc = c.getHeaderField("Location");
                          c.disconnect();
                          if (loc == null) throw new Exception("Redirect tidak valid");
                          cur = new URL(new URL(cur), loc).toString();
                          continue;
                      }
                      if (code >= 400) {
                          c.disconnect();
                          throw new Exception("Server menolak (HTTP " + code + ")");
                      }
                      return c;
                  }
                  throw new Exception("Terlalu banyak redirect");
              }

              private String pickExt(String apiExt, String ctype, String url, String type) {
                  String[] known = {"mp4", "mp3", "m4a", "jpg", "jpeg", "png", "webp", "gif", "webm", "mkv", "mov", "aac", "wav", "ogg"};
                  for (String k : known) if (k.equals(apiExt)) return apiExt;
                  if (ctype != null && !ctype.equals("application/octet-stream")) {
                      String e = MimeTypeMap.getSingleton().getExtensionFromMimeType(ctype);
                      if (e != null) return e;
                  }
                  try {
                      String path = new URL(url).getPath();
                      int dot = path.lastIndexOf('.');
                      if (dot >= 0 && path.length() - dot <= 5) {
                          String e = path.substring(dot + 1).toLowerCase(Locale.ROOT);
                          for (String k : known) if (k.equals(e)) return e;
                      }
                  } catch (Exception ignored) {
                  }
                  String t = type.toLowerCase(Locale.ROOT);
                  if (t.contains("audio")) return "mp3";
                  if (t.contains("image")) return "jpg";
                  return "mp4";
              }

              // download langsung dari aplikasi, simpan langsung ke galeri (MediaStore)
              private Uri download(JSONObject m, String title, String base, String link, Task t, int idx, int count) throws Exception {
                  String url = m.getString("url");
                  String apiExt = m.optString("extension", "").toLowerCase(Locale.ROOT).replace(".", "");
                  String type = m.optString("type", "video");

                  HttpURLConnection c = null;
                  Exception err = null;
                  String[] refs = {null, originOf(link), originOf(url)};
                  for (String ref : refs) {
                      try {
                          c = open(url, ref);
                          err = null;
                          break;
                      } catch (Exception e) {
                          err = e;
                          c = null;
                      }
                  }
                  if (c == null) throw err != null ? err : new Exception("Koneksi gagal");

                  String ctype = c.getContentType();
                  if (ctype != null) ctype = ctype.split(";")[0].trim().toLowerCase(Locale.ROOT);
                  if (ctype != null && (ctype.contains("text/html") || ctype.contains("json"))) {
                      c.disconnect();
                      throw new Exception("Link media kadaluarsa");
                  }

                  String ext = pickExt(apiExt, ctype, url, type);
                  String mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext);
                  if (mime == null) {
                      String tl = type.toLowerCase(Locale.ROOT);
                      mime = tl.contains("audio") ? "audio/mpeg" : (tl.contains("image") ? "image/jpeg" : "video/mp4");
                  }

                  Uri collection;
                  String rel;
                  if (mime.startsWith("video")) {
                      collection = MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
                      rel = Environment.DIRECTORY_MOVIES + "/AllInOneDownloader";
                  } else if (mime.startsWith("audio")) {
                      collection = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                      rel = Environment.DIRECTORY_MUSIC + "/AllInOneDownloader";
                  } else if (mime.startsWith("image")) {
                      collection = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                      rel = Environment.DIRECTORY_PICTURES + "/AllInOneDownloader";
                  } else {
                      collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                      rel = Environment.DIRECTORY_DOWNLOADS + "/AllInOneDownloader";
                  }

                  ContentResolver cr = getContentResolver();
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, base + "_" + System.currentTimeMillis() + "." + ext);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, rel);
                  v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                  Uri out = cr.insert(collection, v);
                  if (out == null) {
                      c.disconnect();
                      throw new Exception("Gagal membuat file di penyimpanan");
                  }

                  long len = c.getContentLengthLong();
                  long got = 0;
                  long lastTick = 0;
                  try (InputStream is = c.getInputStream(); OutputStream os = cr.openOutputStream(out)) {
                      byte[] buf = new byte[32768];
                      int n;
                      while ((n = is.read(buf)) > 0) {
                          os.write(buf, 0, n);
                          got += n;
                          long now = System.currentTimeMillis();
                          if (now - lastTick > 250) {
                              lastTick = now;
                              if (len > 0) {
                                  int overall = (int) ((idx * 100L + (got * 100L / len)) / count);
                                  updateTask(t, overall, overall + "%", mbText(got, len));
                              } else {
                                  updateTask(t, -1, "Downloading", mbText(got, len));
                              }
                          }
                      }
                      os.flush();
                  } catch (Exception e) {
                      cr.delete(out, null, null);
                      throw e;
                  } finally {
                      c.disconnect();
                  }

                  if (got < 1024) {
                      cr.delete(out, null, null);
                      throw new Exception("File kosong / tidak valid");
                  }
                  ContentValues done = new ContentValues();
                  done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                  cr.update(out, done, null, null);

                  addHistory(title, out, mime, got);
                  return out;
              }
          }
