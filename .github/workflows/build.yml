              private void deleteHistoryItem(JSONObject o, final View row) {
                  final long time = o.optLong("time");
                  final String uri = o.optString("uri");
                  row.animate().alpha(0f).translationX(dp(80)).setStartDelay(0).setDuration(220)
                          .setInterpolator(new DecelerateInterpolator())
                          .withEndAction(() -> {
                              removeHistory(time, uri);
                              if (history().length() == 0) {
                                  showTab(1);
                                  return;
                              }
                              ViewGroup parent = (ViewGroup) row.getParent();
                              if (parent != null) parent.removeView(row);
                              toast("Dihapus dari history");
                          }).start();
              }

              private synchronized void removeHistory(long time, String uri) {
                  try {
                      JSONArray old = history();
                      JSONArray n = new JSONArray();
                      for (int i = 0; i < old.length(); i++) {
                          JSONObject x = old.optJSONObject(i);
                          if (x != null && x.optLong("time") == time && x.optString("uri").equals(uri)) continue;
                          n.put(old.get(i));
                      }
                      prefs.edit().putString("history", n.toString()).apply();
                  } catch (Exception ignored) {
                  }
              }

              private void confirmClear() {
                  new android.app.AlertDialog.Builder(this)
                          .setTitle("Hapus history?")
                          .setMessage("Riwayat dihapus. File yang sudah di-download tetap ada di galeri.")
                          .setPositiveButton("Hapus", (d, w) -> {
                              prefs.edit().remove("history").apply();
                              toast("History dihapus");
                              showTab(1);
                          })
                          .setNegativeButton("Batal", null)
                          .show();
              }

              private void openItem(JSONObject o) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(Uri.parse(o.optString("uri")), o.optString("mime"));
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(i);
                  } catch (Exception e) {
                      toast("File tidak bisa dibuka (mungkin sudah dihapus)");
                  }
              }

              private synchronized JSONArray history() {
                  try {
                      return new JSONArray(prefs.getString("history", "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              private synchronized void addHistory(String title, Uri uri, String mime, long size) {
                  try {
                      JSONArray old = history();
                      JSONArray n = new JSONArray();
                      int start = Math.max(0, old.length() - 99);
                      for (int i = start; i < old.length(); i++) n.put(old.get(i));
                      JSONObject o = new JSONObject();
                      o.put("title", title);
                      o.put("uri", uri.toString());
                      o.put("mime", mime);
                      o.put("size", size);
                      o.put("time", System.currentTimeMillis());
                      n.put(o);
                      prefs.edit().putString("history", n.toString()).apply();
                  } catch (Exception ignored) {
                  }
              }

