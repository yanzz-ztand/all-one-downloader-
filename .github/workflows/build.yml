name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/all/downloader
          mkdir -p app/src/main/assets/wallpapers

          # Wallpapers: taruh gambar (jpg/png) di folder "wallpapers/" di repo
          if [ -d wallpapers ]; then cp wallpapers/* app/src/main/assets/wallpapers/ 2>/dev/null || true; fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AllinOneDownloader"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.all.downloader'
              compileSdk 34

              defaultConfig {
                  applicationId "com.all.downloader"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:label="All Downloader"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/all/downloader/MainActivity.java <<'EOF'
          package com.all.downloader;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextClock;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;

          public class MainActivity extends Activity {

              private static final String API =
                      "https://api.ikyyxd.my.id/download/all-in-one?url=";

              private ImageView bg;
              private EditText input;
              private Button btnDownload;
              private LinearLayout infoBox;
              private ImageView infoThumbnail;
              private TextView infoTitle;
              private TextView infoCaption;
              private TextView infoType;
              private String[] walls = new String[0];
              private int idx = 0;

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private GradientDrawable pill(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  bg = new ImageView(this);
                  bg.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  root.addView(bg, new FrameLayout.LayoutParams(-1, -1));

                  // overlay gelap tipis
                  View dim = new View(this);
                  dim.setBackgroundColor(0x40000000);
                  root.addView(dim, new FrameLayout.LayoutParams(-1, -1));

                  // Switch Wallpaper (kiri atas)
                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setPadding(dp(16), dp(40), dp(16), 0);

                  TextView play = new TextView(this);
                  play.setText("\u25B6");
                  play.setTextColor(Color.WHITE);
                  play.setTextSize(22);
                  play.setGravity(Gravity.CENTER);
                  play.setBackground(pill(0xFF000000, 10));
                  top.addView(play, new LinearLayout.LayoutParams(dp(56), dp(56)));

                  TextView sw = new TextView(this);
                  sw.setText("Switch Wallpaper");
                  sw.setTextColor(Color.WHITE);
                  sw.setTextSize(22);
                  sw.setShadowLayer(8, 0, 0, Color.BLACK);
                  sw.setPadding(dp(14), 0, 0, 0);
                  top.addView(sw);

                  top.setOnClickListener(v -> pickWallpaper());
                  top.setOnLongClickListener(v -> {
                      nextWallpaper();
                      return true;
                  });
                  root.addView(top, new FrameLayout.LayoutParams(-2, -2, Gravity.TOP | Gravity.START));

                  // Konten tengah
                  LinearLayout center = new LinearLayout(this);
                  center.setOrientation(LinearLayout.VERTICAL);
                  center.setGravity(Gravity.CENTER_HORIZONTAL);
                  center.setPadding(dp(14), 0, dp(14), 0);

                  TextClock clock = new TextClock(this);
                  clock.setFormat24Hour("HH:mm");
                  clock.setFormat12Hour("HH:mm");
                  clock.setTextColor(Color.WHITE);
                  clock.setTextSize(72);
                  clock.setTypeface(Typeface.DEFAULT_BOLD);
                  clock.setShadowLayer(16, 0, 0, 0xFFFFFFFF);
                  center.addView(clock);

                  // Kolom link + tombol paste
                  FrameLayout linkBox = new FrameLayout(this);
                  linkBox.setBackground(pill(0x99333333, 18));

                  input = new EditText(this);
                  input.setHint("Link Download");
                  input.setHintTextColor(Color.WHITE);
                  input.setTextColor(Color.WHITE);
                  input.setTextSize(18);
                  input.setSingleLine(true);
                  input.setGravity(Gravity.CENTER);
                  input.setBackground(null);
                  input.setPadding(dp(56), dp(14), dp(56), dp(14));
                  linkBox.addView(input, new FrameLayout.LayoutParams(-1, -2));

                  TextView paste = new TextView(this);
                  paste.setText("\uD83D\uDCCB");
                  paste.setTextSize(22);
                  paste.setGravity(Gravity.CENTER);
                  paste.setOnClickListener(v -> pasteClipboard());
                  linkBox.addView(paste, new FrameLayout.LayoutParams(dp(52), dp(52),
                          Gravity.END | Gravity.CENTER_VERTICAL));

                  LinearLayout.LayoutParams lpLink = new LinearLayout.LayoutParams(-1, -2);
                  lpLink.topMargin = dp(24);
                  center.addView(linkBox, lpLink);

                  infoBox = new LinearLayout(this);
                  infoBox.setOrientation(LinearLayout.VERTICAL);
                  infoBox.setPadding(dp(12), dp(12), dp(12), dp(12));
                  infoBox.setBackground(pill(0xCC222222, 16));
                  infoBox.setVisibility(View.GONE);

                  TextView infoHeading = new TextView(this);
                  infoHeading.setText("Tipe Download");
                  infoHeading.setTextColor(0xFFF2B93B);
                  infoHeading.setTextSize(17);
                  infoHeading.setTypeface(null, Typeface.BOLD);
                  infoBox.addView(infoHeading);

                  infoThumbnail = new ImageView(this);
                  infoThumbnail.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  LinearLayout.LayoutParams thumbLp = new LinearLayout.LayoutParams(-1, dp(150));
                  thumbLp.topMargin = dp(8);
                  infoBox.addView(infoThumbnail, thumbLp);

                  infoTitle = new TextView(this);
                  infoTitle.setTextColor(Color.WHITE);
                  infoTitle.setTextSize(18);
                  infoTitle.setTypeface(null, Typeface.BOLD);
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(-1, -2);
                  titleLp.topMargin = dp(10);
                  infoBox.addView(infoTitle, titleLp);

                  infoCaption = new TextView(this);
                  infoCaption.setTextColor(0xFFE0E0E0);
                  infoCaption.setTextSize(14);
                  LinearLayout.LayoutParams captionLp = new LinearLayout.LayoutParams(-1, -2);
                  captionLp.topMargin = dp(5);
                  infoBox.addView(infoCaption, captionLp);

                  infoType = new TextView(this);
                  infoType.setTextColor(0xFFF2B93B);
                  infoType.setTextSize(13);
                  LinearLayout.LayoutParams typeLp = new LinearLayout.LayoutParams(-1, -2);
                  typeLp.topMargin = dp(7);
                  infoBox.addView(infoType, typeLp);

                  LinearLayout.LayoutParams infoLp = new LinearLayout.LayoutParams(-1, -2);
                  infoLp.topMargin = dp(14);
                  center.addView(infoBox, infoLp);

                  btnDownload = new Button(this);
                  btnDownload.setText("Download");
                  btnDownload.setAllCaps(false);
                  btnDownload.setTextSize(20);
                  btnDownload.setTextColor(0xFFF2B93B);
                  btnDownload.setBackground(pill(0x99333333, 12));
                  btnDownload.setOnClickListener(v -> startDownload());
                  LinearLayout.LayoutParams lpBtn = new LinearLayout.LayoutParams(dp(220), dp(54));
                  lpBtn.topMargin = dp(10);
                  lpBtn.gravity = Gravity.START;
                  lpBtn.leftMargin = dp(30);
                  center.addView(btnDownload, lpBtn);

                  root.addView(center, new FrameLayout.LayoutParams(-1, -2, Gravity.CENTER));
                  setContentView(root);

                  try {
                      walls = getAssets().list("wallpapers");
                      if (walls == null) walls = new String[0];
                  } catch (Exception e) {
                      walls = new String[0];
                  }
                  loadWallpaper();
                  requestStoragePermission();
              }

              private static final int REQ_PERM = 100;
              private static final int REQ_PICK = 101;
              private boolean pendingPick = false;

              private String[] perms() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      return new String[]{Manifest.permission.READ_MEDIA_IMAGES};
                  }
                  return new String[]{Manifest.permission.READ_EXTERNAL_STORAGE};
              }

              private boolean hasPerm() {
                  return checkSelfPermission(perms()[0]) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestStoragePermission() {
                  if (!hasPerm()) requestPermissions(perms(), REQ_PERM);
              }

              private void pickWallpaper() {
                  if (!hasPerm()) {
                      pendingPick = true;
                      requestPermissions(perms(), REQ_PERM);
                      return;
                  }
                  openPicker();
              }

              private void openPicker() {
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.setType("image/*");
                  startActivityForResult(Intent.createChooser(i, "Pilih wallpaper"), REQ_PICK);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] p, int[] r) {
                  super.onRequestPermissionsResult(code, p, r);
                  if (code != REQ_PERM) return;
                  boolean ok = r.length > 0 && r[0] == PackageManager.PERMISSION_GRANTED;
                  toast(ok ? "Izin storage diberikan" : "Izin storage ditolak");
                  // picker bawaan sistem tetap bisa dipakai walau izin ditolak
                  if (pendingPick) openPicker();
                  pendingPick = false;
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_PICK && res == RESULT_OK && data != null && data.getData() != null) {
                      saveAndShow(data.getData());
                  }
              }

              private void saveAndShow(Uri uri) {
                  File out = new File(getFilesDir(), "wallpaper.img");
                  try (InputStream is = getContentResolver().openInputStream(uri);
                       OutputStream os = new FileOutputStream(out)) {
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = is.read(buf)) > 0) os.write(buf, 0, n);
                  } catch (Exception e) {
                      toast("Gagal ganti wallpaper: " + e.getMessage());
                      return;
                  }
                  loadWallpaper();
                  toast("Wallpaper diganti");
              }

              private void loadWallpaper() {
                  File f = new File(getFilesDir(), "wallpaper.img");
                  if (f.exists()) {
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(f.getPath(), bounds);
                      int sample = 1;
                      while (bounds.outWidth / sample > 1600) sample *= 2;
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inSampleSize = sample;
                      Bitmap b = BitmapFactory.decodeFile(f.getPath(), o);
                      if (b != null) {
                          bg.setImageBitmap(b);
                          return;
                      }
                  }
                  showWallpaper();
              }

              private void nextWallpaper() {
                  if (walls.length == 0) {
                      toast("Belum ada wallpaper di folder wallpapers/");
                      return;
                  }
                  idx = (idx + 1) % walls.length;
                  showWallpaper();
              }

              private void showWallpaper() {
                  if (walls.length == 0) return;
                  try (InputStream is = getAssets().open("wallpapers/" + walls[idx])) {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inSampleSize = 2;
                      Bitmap bmp = BitmapFactory.decodeStream(is, null, o);
                      bg.setImageBitmap(bmp);
                  } catch (Exception e) {
                      toast("Gagal load wallpaper");
                  }
              }

              private void pasteClipboard() {
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null && cm.hasPrimaryClip() && cm.getPrimaryClip().getItemCount() > 0) {
                      CharSequence t = cm.getPrimaryClip().getItemAt(0).coerceToText(this);
                      input.setText(t);
                  } else {
                      toast("Clipboard kosong");
                  }
              }

              private void startDownload() {
                  final String link = input.getText().toString().trim();
                  if (link.isEmpty()) {
                      toast("Masukkan link dulu");
                      return;
                  }
                  btnDownload.setEnabled(false);
                  btnDownload.setText("Loading...");
                  new Thread(() -> {
                      try {
                          String[] res = fetchMedia(link); // url, ext, title, caption, thumbnail, type
                          runOnUiThread(() -> {
                              showDownloadInfo(res);
                              enqueue(res[0], res[1]);
                          });
                      } catch (Exception e) {
                          final String msg = e.getMessage();
                          runOnUiThread(() -> toast("Gagal: " + msg));
                      } finally {
                          runOnUiThread(() -> {
                              btnDownload.setEnabled(true);
                              btnDownload.setText("Download");
                          });
                      }
                  }).start();
              }

              private String[] fetchMedia(String link) throws Exception {
                  URL u = new URL(API + URLEncoder.encode(link, "UTF-8"));
                  HttpURLConnection c = (HttpURLConnection) u.openConnection();
                  c.setConnectTimeout(20000);
                  c.setReadTimeout(30000);
                  c.setRequestProperty("User-Agent", "Mozilla/5.0");
                  int code = c.getResponseCode();
                  InputStream is = code >= 400 ? c.getErrorStream() : c.getInputStream();
                  BufferedReader br = new BufferedReader(new InputStreamReader(is));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = br.readLine()) != null) sb.append(line);
                  br.close();

                  JSONObject json = new JSONObject(sb.toString());
                  if (!json.optBoolean("status", false)) throw new Exception("API menolak link");
                  JSONObject result = json.getJSONObject("result");
                  JSONArray medias = result.optJSONArray("medias");
                  if (medias == null || medias.length() == 0) throw new Exception("Media tidak ditemukan");

                  JSONObject pick = null;
                  // prioritas: hd_no_watermark > no_watermark > video pertama > media pertama
                  for (int i = 0; i < medias.length(); i++) {
                      JSONObject m = medias.getJSONObject(i);
                      if ("video".equals(m.optString("type")) && "hd_no_watermark".equals(m.optString("quality"))) {
                          pick = m;
                          break;
                      }
                  }
                  if (pick == null) {
                      for (int i = 0; i < medias.length(); i++) {
                          JSONObject m = medias.getJSONObject(i);
                          if ("video".equals(m.optString("type")) && "no_watermark".equals(m.optString("quality"))) {
                              pick = m;
                              break;
                          }
                      }
                  }
                  if (pick == null) {
                      for (int i = 0; i < medias.length(); i++) {
                          JSONObject m = medias.getJSONObject(i);
                          if ("video".equals(m.optString("type"))) {
                              pick = m;
                              break;
                          }
                      }
                  }
                  if (pick == null) pick = medias.getJSONObject(0);

                  String title = result.optString("title", "").trim();
                  String caption = result.optString("caption", "").trim();
                  if (caption.isEmpty()) caption = result.optString("source", "").trim();
                  String thumbnailUrl = result.optString("thumbnail", "").trim();
                  String mediaType = result.optString("type", "single").trim();

                  // Field author/creator sengaja tidak ditampilkan.
                  return new String[]{
                          pick.getString("url"),
                          pick.optString("extension", "mp4"),
                          title,
                          caption,
                          thumbnailUrl,
                          mediaType
                  };
              }

              private void showDownloadInfo(String[] data) {
                  infoBox.setVisibility(View.VISIBLE);
                  infoTitle.setText(data[2].isEmpty() ? "Tanpa Title" : data[2]);
                  infoCaption.setText(data[3].isEmpty() ? "Caption tidak tersedia" : data[3]);
                  infoType.setText("Media: " + data[5] + " • Format: " + data[1].toUpperCase());
                  infoThumbnail.setImageDrawable(null);

                  if (!data[4].isEmpty()) {
                      new Thread(() -> {
                          HttpURLConnection connection = null;
                          try {
                              connection = (HttpURLConnection) new URL(data[4]).openConnection();
                              connection.setConnectTimeout(15000);
                              connection.setReadTimeout(15000);
                              connection.setRequestProperty("User-Agent", "Mozilla/5.0");
                              Bitmap bitmap;
                              try (InputStream stream = connection.getInputStream()) {
                                  bitmap = BitmapFactory.decodeStream(stream);
                              }
                              if (bitmap != null) {
                                  runOnUiThread(() -> infoThumbnail.setImageBitmap(bitmap));
                              }
                          } catch (Exception ignored) {
                          } finally {
                              if (connection != null) connection.disconnect();
                          }
                      }).start();
                  }
              }

              private void enqueue(String url, String ext) {
                  try {
                      DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                      r.setTitle("Download");
                      r.addRequestHeader("User-Agent", "Mozilla/5.0");
                      r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,
                              "download_" + System.currentTimeMillis() + "." + ext);
                      ((DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(r);
                      toast("Download dimulai, cek notifikasi");
                  } catch (Exception e) {
                      toast("Gagal download: " + e.getMessage());
                  }
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }
          }
          EOF

      - name: Generate app icon
        run: |
          # Taruh gambar icon di root repo dengan nama "icon.png" (disarankan persegi, min 512x512)
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
          fi
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          if [ ! -f icon.png ]; then
            echo "icon.png tidak ditemukan, pakai icon default"
            $IM -size 512x512 xc:'#F2B93B' icon.png
          fi
          for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="app/src/main/res/mipmap-${entry%%:*}"
            size="${entry##*:}"
            mkdir -p "$dir"
            $IM icon.png -gravity center -crop 1:1 +repage -resize ${size}x${size} "$dir/ic_launcher.png"
          done

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AllinOneDownloader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
