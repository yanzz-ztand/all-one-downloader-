              // ---------- helpers ----------
              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private int withAlpha(int c, int a) {
                  return (c & 0x00FFFFFF) | (a << 24);
              }

              private int hsv(float h, float s, float v) {
                  return Color.HSVToColor(new float[]{h % 360f, s, v});
              }

              private GradientDrawable shape(int color, int r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(r));
                  return g;
              }

              private GradientDrawable grad(int c1, int c2, int r) {
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, new int[]{c1, c2});
                  g.setCornerRadius(dp(r));
                  return g;
              }

              private TextView tv(String s, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private ImageView icon(int res, int padDp, int tint) {
                  ImageView i = new ImageView(this);
                  i.setImageResource(res);
                  i.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  i.setPadding(dp(padDp), dp(padDp), dp(padDp), dp(padDp));
                  if (tint != 0) i.setColorFilter(tint);
                  return i;
              }

              private LinearLayout.LayoutParams lp(int w, int h, int l, int t, int r, int b) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h);
                  p.setMargins(l, t, r, b);
                  return p;
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }

              private LinearLayout column() {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(18), dp(14), dp(18), dp(10));
