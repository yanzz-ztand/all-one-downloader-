                      ImageView ic = icon(R.drawable.ic_check, 10, WHITE);
                      ic.setBackground(shape(withAlpha(cAcc, 0x77), 12));
                      r.addView(ic, new LinearLayout.LayoutParams(dp(42), dp(42)));
                  } else {
                      FrameLayout holder = new FrameLayout(this);
                      ImageView ic = icon(R.drawable.ic_download, 12, WHITE);
                      ic.setBackground(shape(withAlpha(cAcc, 0x55), 21));
                      holder.addView(ic, new FrameLayout.LayoutParams(-1, -1));
                      holder.addView(new RainbowSpinner(this), new FrameLayout.LayoutParams(-1, -1));
                      r.addView(holder, new LinearLayout.LayoutParams(dp(44), dp(44)));
                  }

                  LinearLayout mid = new LinearLayout(this);
                  mid.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout line = new LinearLayout(this);
                  TextView name = tv(title.isEmpty() ? "Download" : title, 14, WHITE, false);
                  name.setSingleLine(true);
                  name.setEllipsize(TextUtils.TruncateAt.END);
                  line.addView(name, new LinearLayout.LayoutParams(0, -2, 1f));
                  TextView pct = tv(right, 13, 0xCCFFFFFF, false);
