              private void refreshRecent() {
                  if (recentBox == null || tab != 0) return;
                  recentBox.removeAllViews();
                  for (Task t : tasks) {
                      recentBox.addView(taskRow(t), lp(-1, -2, 0, 0, 0, dp(8)));
                  }
                  JSONArray h = history();
                  int shown = 0;
                  for (int i = h.length() - 1; i >= 0 && shown < 4; i--) {
                      JSONObject o = h.optJSONObject(i);
                      if (o == null) continue;
                      recentBox.addView(historyRow(o, false), lp(-1, -2, 0, 0, 0, dp(8)));
                      shown++;
                  }
                  if (recentBox.getChildCount() == 0) {
                      recentBox.addView(tv("Belum ada download", 14, 0x99FFFFFF, false));
                  }
              }

