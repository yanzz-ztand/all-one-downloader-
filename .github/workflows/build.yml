              private void showTab(int t) {
                  tab = t;
                  content.removeAllViews();
                  View v;
                  if (t == 0) v = buildHome();
                  else if (t == 1) v = buildHistory();
                  else if (t == 2) v = buildProfile();
                  else v = buildSettings();
                  content.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  animateIn(v);
                  refreshNav();
              }

              private void refreshNav() {
                  navBox.removeAllViews();
                  int[] icons = {R.drawable.ic_home, R.drawable.ic_history, R.drawable.ic_profile, R.drawable.ic_settings};
                  String[] labels = {"Home", "History", "Profile", "Settings"};
                  for (int i = 0; i < 4; i++) {
                      final int idx = i;
                      LinearLayout item = new LinearLayout(this);
                      item.setOrientation(LinearLayout.VERTICAL);
                      item.setGravity(Gravity.CENTER);
                      item.setPadding(0, dp(6), 0, dp(6));
                      boolean sel = (i == tab);
                      if (sel) {
                          item.setBackground(selPill());
                          item.setScaleX(0.86f);
                          item.setScaleY(0.86f);
                          item.animate().scaleX(1f).scaleY(1f).setStartDelay(0).setDuration(450)
                                  .setInterpolator(new OvershootInterpolator(2.5f)).start();
                      }
                      ImageView ic = icon(icons[i], 0, sel ? WHITE : 0xAAFFFFFF);
                      TextView lb = tv(labels[i], 12, sel ? WHITE : 0xAAFFFFFF, sel);
                      lb.setGravity(Gravity.CENTER);
