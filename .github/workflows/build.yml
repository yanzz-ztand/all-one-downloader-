      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AllinOneDownloader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
