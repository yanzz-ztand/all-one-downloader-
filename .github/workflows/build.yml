              private void saveProfilePhoto(final Uri uri) {
                  toast("Menyimpan foto profil...");
                  new Thread(() -> {
                      try {
                          BitmapFactory.Options b = new BitmapFactory.Options();
                          b.inJustDecodeBounds = true;
                          try (InputStream is = getContentResolver().openInputStream(uri)) {
                              BitmapFactory.decodeStream(is, null, b);
                          }
                          int sample = 1;
                          while (Math.min(b.outWidth, b.outHeight) / sample > 1024) sample *= 2;
                          BitmapFactory.Options o = new BitmapFactory.Options();
                          o.inSampleSize = sample;
                          Bitmap bmp;
                          try (InputStream is = getContentResolver().openInputStream(uri)) {
                              bmp = BitmapFactory.decodeStream(is, null, o);
                          }
                          if (bmp == null) throw new Exception("Gambar tidak valid");
                          int orient = 1;
                          try (InputStream is = getContentResolver().openInputStream(uri)) {
                              orient = new android.media.ExifInterface(is)
                                      .getAttributeInt(android.media.ExifInterface.TAG_ORIENTATION, 1);
                          } catch (Exception ignored) {
                          }
                          Matrix rot = new Matrix();
                          if (orient == 6) rot.postRotate(90);
                          else if (orient == 3) rot.postRotate(180);
                          else if (orient == 8) rot.postRotate(270);
                          int side = Math.min(bmp.getWidth(), bmp.getHeight());
                          Bitmap sq = Bitmap.createBitmap(bmp, (bmp.getWidth() - side) / 2, (bmp.getHeight() - side) / 2,
                                  side, side, rot, true);
                          Bitmap fin = Bitmap.createScaledBitmap(sq, 512, 512, true);
                          File f = new File(getFilesDir(), "profile_" + System.currentTimeMillis() + ".jpg");
                          try (OutputStream os = new FileOutputStream(f)) {
                              fin.compress(Bitmap.CompressFormat.JPEG, 90, os);
                          }
                          String old = prefs.getString("prof_path", null);
                          prefs.edit().putString("prof_path", f.getPath()).apply();
                          if (old != null) new File(old).delete();
                          runOnUiThread(() -> {
                              toast("Foto profil diganti");
                              if (tab == 2) showTab(2);
                          });
                      } catch (Exception e) {
                          final String msg = e.getMessage();
                          runOnUiThread(() -> toast("Gagal ganti foto: " + msg));
                      }
                  }).start();
              }

