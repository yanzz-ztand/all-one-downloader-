              // ---------- wallpaper (foto / video) ----------
              private void applyWallpaper() {
                  stopVideo();
                  wallImg.setImageDrawable(null);
                  wallVideo.setVisibility(View.GONE);
                  hasWall = false;

                  String type = prefs.getString("wall_type", "");
                  String path = prefs.getString("wall_path", null);
                  if (path != null && new File(path).exists()) {
                      if ("image".equals(type)) {
                          try {
                              BitmapFactory.Options bounds = new BitmapFactory.Options();
                              bounds.inJustDecodeBounds = true;
                              BitmapFactory.decodeFile(path, bounds);
                              int sample = 1;
                              while (bounds.outWidth / sample > 1600) sample *= 2;
                              BitmapFactory.Options o = new BitmapFactory.Options();
                              o.inSampleSize = sample;
                              Bitmap bmp = BitmapFactory.decodeFile(path, o);
                              if (bmp != null) {
                                  wallImg.setImageBitmap(bmp);
                                  hasWall = true;
                              }
                          } catch (Exception ignored) {
                          }
                      } else if ("video".equals(type)) {
                          hasWall = true;
                          wallVideo.setVisibility(View.VISIBLE);
                          startVideo();
                      }
                  }
                  applyWallAlpha();
                  applyColors();
              }

              private void startVideo() {
                  stopVideo();
                  String path = prefs.getString("wall_path", null);
                  if (!"video".equals(prefs.getString("wall_type", "")) || path == null || videoSt == null) return;
                  try {
                      videoSurface = new Surface(videoSt);
                      player = new MediaPlayer();
                      player.setDataSource(path);
                      player.setSurface(videoSurface);
                      player.setLooping(true);
                      float vol = isMuted() ? 0f : 1f;
                      player.setVolume(vol, vol);
                      player.setOnErrorListener((mp, what, extra) -> true);
                      player.setOnVideoSizeChangedListener((mp, w, h) -> fitVideo(w, h));
                      player.setOnPreparedListener(mp -> mp.start());
                      player.prepareAsync();
                  } catch (Exception e) {
                      stopVideo();
                  }
              }

              private void stopVideo() {
                  if (player != null) {
                      try {
                          player.release();
                      } catch (Exception ignored) {
                      }
                      player = null;
                  }
                  if (videoSurface != null) {
                      videoSurface.release();
                      videoSurface = null;
                  }
              }

              private void fitVideo(int vw, int vh) {
                  float w = wallVideo.getWidth();
                  float h = wallVideo.getHeight();
                  if (w == 0 || h == 0 || vw == 0 || vh == 0) return;
                  float s = Math.max(w / vw, h / vh);
                  Matrix m = new Matrix();
                  m.setScale(vw * s / w, vh * s / h, w / 2f, h / 2f);
                  wallVideo.setTransform(m);
              }

              private void pickWallpaper() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"image/*", "video/*"});
                  startActivityForResult(i, REQ_PICK);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_PICK && res == RESULT_OK && data != null && data.getData() != null) {
                      saveWallpaper(data.getData());
                  } else if (req == REQ_PROFILE && res == RESULT_OK && data != null && data.getData() != null) {
                      saveProfilePhoto(data.getData());
                  }
              }

              private void saveWallpaper(final Uri uri) {
                  toast("Menyimpan wallpaper...");
                  new Thread(() -> {
                      try {
                          String mime = getContentResolver().getType(uri);
                          if (mime == null) mime = "";
                          String type = mime.startsWith("video") ? "video" : (mime.startsWith("image") ? "image" : null);
                          if (type == null) {
                              runOnUiThread(() -> toast("Pilih file foto atau video"));
                              return;
                          }
                          String ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime);
                          if (ext == null) ext = type.equals("video") ? "mp4" : "jpg";
                          File out = new File(getFilesDir(), "wallpaper_" + System.currentTimeMillis() + "." + ext);
                          try (InputStream is = getContentResolver().openInputStream(uri);
                               OutputStream os = new FileOutputStream(out)) {
                              byte[] buf = new byte[16384];
                              int n;
                              while ((n = is.read(buf)) > 0) os.write(buf, 0, n);
                          }
                          String old = prefs.getString("wall_path", null);
                          prefs.edit().putString("wall_path", out.getPath()).putString("wall_type", type).apply();
                          if (old != null) new File(old).delete();
                          runOnUiThread(() -> {
                              applyWallpaper();
                              buildUI();
                              toast("Wallpaper diganti");
                          });
                      } catch (Exception e) {
                          final String m = e.getMessage();
                          runOnUiThread(() -> toast("Gagal ganti wallpaper: " + m));
                      }
                  }).start();
              }

              private void removeCustomWallpaper() {
                  String old = prefs.getString("wall_path", null);
                  if (old != null) new File(old).delete();
                  prefs.edit().remove("wall_path").remove("wall_type").apply();
                  applyWallpaper();
                  buildUI();
                  toast("Wallpaper dihapus");
              }

